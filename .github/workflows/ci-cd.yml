name: CI/CD Pipeline - gescon

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-and-test:
    name: Build y Tests Unitarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gescon

    steps:
      - name:  Checkout del código
        uses: actions/checkout@v4

      - name:  Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name:  Dar permisos a mvnw
        run: chmod +x mvnw

      - name:  Build con Maven (sin tests)
        run: ./mvnw clean package -DskipTests

      - name:  Ejecutar Tests Unitarios (JUnit)
        run: ./mvnw test

      - name:  Subir resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: gescon/target/surefire-reports/

  docker-build-push:
    name: Build y Push imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name:  Checkout del código
        uses: actions/checkout@v4

      - name:  Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name:  Build y Push imagen
        uses: docker/build-push-action@v5
        with:
          context: gescon
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gescon_jcj:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gescon_jcj:${{ github.sha }}

  deploy:
    name: Deploy en EC2 AWS
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name:  Checkout del código
        uses: actions/checkout@v4

      - name:  Deploy vía SSH en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /usr/app_aaee_jcj
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/gescon_jcj:latest
            docker-compose down
            docker-compose up -d
            docker-compose ps
